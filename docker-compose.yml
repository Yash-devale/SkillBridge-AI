services:
  skillbridge-ai:
    build:
      context: .
    image: skillbridge-ai:local
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
